        description: 口语随堂测试、期末听力与精读考试的流程和复习提醒。
        status: 考试说明
        url: ""
        wide: true
        notes:
          - "听说：通常在第 17 周进行口语随堂测试，4 至 5 人一组，抽取或指定话题后准备约 5 分钟，每人表述约 2 分钟。"
          - "听力：与期末考试一起机考，难度和题型接近四级听力，包括短对话、长对话和篇章。"
          - "精读：期末主要考阅读、英汉与汉英翻译以及小作文，部分翻译内容来自 U 校园配套课本原文。"
          - "平时分：签到和学习通作业会计入成绩，期末成绩占比较高，平时任务也需要认真完成。"
